<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="myday.css">
    <title>MY.DAY</title>

</head>

<body>
    <div class="paginaMyday">


        <section class="login" id="login">
            <div class="logo"><span class="my">MY.</span><span class="day">DAY</span></div>

            <div class="campos">
                <label for="usuario">Nombre de usuario</label>
                <input id="usuario" type="text" placeholder="" />
            </div>

            <div class="campos">
                <label for="contrasena">Contraseña</label>
                <input id="contrasena" type="password" placeholder="" />
            </div>

            <button class="btnInicio" onclick="loggear()">
                💬 EMPEZAR EL DÍA
            </button>

            <div class="textoRegistro">
                ¿No tienes cuenta? <a href="#">Regístrate aquí</a>
            </div>
        </section>


        <section class="pagina_main" id="pagina_main">
            <nav class="barra">
                <button class="btnBarra" onclick="cambiarSeccion('inicio')">Inicio</button>
                <button class="btnBarra" onclick="cambiarSeccion('subirFoto')">Subir foto</button>
                <button class="btnBarra" onclick="cambiarSeccion('perfil')">Perfil</button>
            </nav>

            <div class="contenidoNav" id="inicio">
                <h2>Feed de Publicaciones</h2>
                <p>Aquí aparecerán las publicaciones...</p>
            </div>
            <div class="contenidoNav" id="subirFoto">
                <h2>Subir Foto</h2>
                <textarea placeholder="Escribe algo..." style="resize: none;" maxlength="255"></textarea><br>
                <input type="file" accept="image/*"><br>
                <button>Publicar</button>
            </div>
            <div class="contenidoNav" id="perfil">
                <h2>Mi Perfil</h2>
                <p id="nombreUsuario">Usuario</p>
                <p>Email: usuario@myday.com</p>
            </div>


        </section>
    </div>

    <script>
        async function loggear() {
            const usuario = document.getElementById("usuario").value;
            const contrasena = document.getElementById("contrasena").value;

            if (!usuario || !contrasena) {
                alert("Rellena todos los campos")
                return;
            }
            try {
                const response = await fetch("http://localhost:8080/api-proyecto/rest/usuarios/", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        nombreUsuario: usuario,
                        contrasena: contrasena
                    })
                });

                if (response.ok) {
                    // LOGIN OK
                    document.getElementById('login').style.display = 'none';
                    document.getElementById('pagina_main').style.display = 'flex';

                    document.getElementById("nombreUsuario").innerText = usuario;
                    
                } else {
                    const msg = await response.text();
                    alert("Error login: " + msg);
                }

            } catch (error) {
                console.error(error);
                alert("Error de conexión con la API");
            }

        }
        function enterApp() {
            document.getElementById('login').style.display = 'none';
            document.getElementById('pagina_main').style.display = 'flex';

        }
        function cambiarSeccion(seccion) {
            document.getElementById('inicio').style.display = 'none';
            document.getElementById('subirFoto').style.display = 'none';
            document.getElementById('perfil').style.display = 'none';
            document.getElementById(seccion).style.display = 'block';
        }
    </script>
</body>

</html>
