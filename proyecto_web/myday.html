<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>MY.DAY</title>
<link rel="stylesheet" href="myday.css">
</head>

<body>

<div class="paginaMyday">

  <!-- LOGIN -->
  <section class="login" id="login">

  <div class="logo">
    <span class="my">MY.</span><span class="day">DAY</span>
  </div>

  <!-- LOGIN FORM -->
  <div id="loginForm">

    <input id="usuario" placeholder="Usuario">
    <input id="contrasena" type="password" placeholder="Contraseña">

    <button onclick="hacerLogin()">Entrar</button>
    <button onclick="mostrarRegistro()">Registrarse</button>

  </div>

  <!-- REGISTRO FORM -->
  <div id="registerForm" style="display:none;">

    <input id="reg_usuario" placeholder="Usuario">
    <input id="reg_email" placeholder="Email">
    <input id="reg_pass" type="password" placeholder="Contraseña">
    <input id="reg_pass2" type="password" placeholder="Confirmar contraseña">

    <button onclick="registrar()">Crear cuenta</button>
    <button onclick="mostrarLogin()">Volver</button>

  </div>

</section>

  <!-- APP -->
  <section id="app" style="display:none;">

    
    <div class="header-logo">
      <img src="myday.png" alt="logo">
    </div>

    <nav>
      <button onclick="mostrar('feed')">Inicio</button>
      <button onclick="mostrar('subir')">Subir</button>
      <button onclick="mostrar('perfil')">Perfil</button>
      <button class="logout-small" onclick="cerrarSesion()">Cerrar sesión</button>
    </nav>

    <!-- FEED -->
    <div id="feed"></div>

    <!-- SUBIR -->
    <div id="subir" style="display:none;">
      <textarea id="texto"></textarea>
      <input type="file" id="imagen">
      <button onclick="subirPost()">Publicar</button>
    </div>

    <!-- PERFIL -->
    <div id="perfil" style="display:none;">
      <h3 id="nombrePerfil"></h3>
      <div id="misFotos"></div>
    </div>

  </section>

</div>

<script src="app.js"></script>

</body>
</html>
